## 自動跑測試。
##
## 專案的 README 自己寫著「規則被改壞是沉默的：報告照樣產生、
## 數字照樣漂亮，只是錯的」，但在這份檔案出現之前，那 400 多條斷言
## 只在有人想到要打 `python tests/run_all.py` 的時候才會跑——
## PR #4/#7/#8/#9 全都是零自動檢查合併的。
##
## 測試不連外網（datasource 被 stub 掉），所以 CI 上跑得完，
## 而且不會因為證交所今天慢就變紅。

name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: python tests/run_all.py
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 跑測試
        run: python tests/run_all.py --verbose

  launcher-syntax:
    # 每日排程的 .ps1 壞掉的話，症狀是「排程安靜地什麼都沒做」——
    # 那是這個專案最不想要的失敗方式，而且不會有任何測試碰到它。
    # 至少先確保它們語法是對的。
    name: PowerShell 語法檢查
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解析 launch/win 底下所有 .ps1
        shell: powershell
        run: |
          # 用 foreach 陳述式而不是 ForEach-Object：後者的 script block
          # 是子範圍，$bad = 1 只會改到副本，退出碼永遠是 0——
          # 又一個「安靜地不做事」。
          $bad = 0
          foreach ($f in (Get-ChildItem -Path launch/win -Filter *.ps1 -Recurse)) {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $f.FullName, [ref]$null, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              $bad = 1
              Write-Host "FAIL $($f.Name)"
              foreach ($e in $errors) {
                Write-Host "  line $($e.Extent.StartLineNumber): $($e.Message)"
              }
            } else {
              Write-Host "OK   $($f.Name)"
            }
          }
          exit $bad
