# ============================================================
# 公司行為（除權息、股票分割）—— 還原權值用
# ============================================================
# 這份檔案存在的理由：資料源給的是當天實際成交的價格，不會替你還原權值。
# 沒有它，0050 在 2025-06-18 會是一根 -74.8% 的 K（其實是 1 拆 4），
# 均線、期間報酬、停損判斷全部跟著錯。
#
# 怎麼產生:
#   python3 src/adjust.py --scan          偵測並列出（不寫檔）
#   python3 src/adjust.py --scan --write  偵測並寫進這個檔案
#
# 自動偵測只抓得到「跌幅超過 10% 漲跌幅上限」的斷崖——那種不可能是真的跌。
# **一般現金股息抓不到**（跌 5% 跟真的跌 5% 長得一樣），要自己補。
#
# 欄位:
#   date        除權息日／分割生效日。當天的價格已經是新基準，
#               系統還原的是這一天「之前」的每一根 K。
#   factor      參考價 ÷ 前一日收盤，例如 1 拆 4 → 0.25
#   ref_price   也可以改填這兩個讓系統自己算 factor，比較好稽核——
#   prev_close    這兩個數字就是公告上印的
#   kind        split（分割，會連成交量一起還原）| dividend（配息，不動量）
#   source      detected（自動偵測）| manual（手動補登）| quote（行情反推）
#   ignore      設 true = 保留這筆紀錄但不套用（用來標記誤判）
#   note        給人看的說明
#
# 手動補一筆現金股息的例子:
#
#   "2412":
#     - date: "2026-07-15"
#       prev_close: 136.5
#       ref_price: 131.0
#       kind: dividend
#       source: manual
#       note: "配息 5.5 元"

actions:
  "0050":
    - date: "2025-06-18"
      factor: 0.25000000
      kind: split
      source: detected
      note: "自動偵測：188.65 → 47.57（中間隔了 8 天，因子可能不準）；吸附到 1:4 分割"
  "2603":
    - date: "2026-06-17"
      factor: 0.89795918
      kind: dividend
      source: detected
      ignore: true
      note: "疑似除權息：220.5 → 194；此因子由開盤價估算，請填入公告的除權息參考價後把 ignore 拿掉"
  "3034":
    - date: "2026-07-13"
      factor: 0.91143911
      kind: dividend
      source: detected
      ignore: true
      note: "疑似除權息：542 → 467.5；此因子由開盤價估算，請填入公告的除權息參考價後把 ignore 拿掉"
