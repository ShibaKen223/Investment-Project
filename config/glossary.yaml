# ============================================================
# 名詞辭典 —— 看懂新聞和法說會在講什麼
# ============================================================
# 這份檔案是**靜態知識**，不是即時資料。
# 它解釋「這個詞是什麼、在幹嘛、為什麼你會在新聞裡看到它」，
# 讓你讀得懂研究報告和財經新聞，而不是替你判斷該不該買。
#
# 定義本身很少過時（CoWoS 是什麼不會變），
# 但「誰是主要供應商」「哪家市占多少」這類會變的東西，
# 這裡刻意不寫——寫了就會變成一份你以為還準、其實早就過期的資料。
#
# 想補詞就直接往下加，格式:
#   代號:
#     term:  正式名稱
#     alias: [其他常見叫法]           # 研究報告會用它們做關鍵字比對
#     one_liner: 一句話講完
#     detail: 多一點背景
#     why_it_matters: 為什麼你會在新聞裡看到它
# ------------------------------------------------------------

terms:

  # ==========================================================
  # 半導體：從沙子到晶片
  # ==========================================================

  wafer:
    term: 晶圓
    alias: [wafer, 12 吋晶圓, 8 吋晶圓]
    category: 半導體製程
    one_liner: 一片圓形的矽晶片，是製造所有晶片的基材，一片上面能切出成百上千顆晶片。
    detail: >-
      尺寸講「吋」（8 吋、12 吋），越大片一次能做的晶片越多、單顆成本越低。
      先進製程幾乎都用 12 吋。產能常以「月產能多少萬片」來計算。
    why_it_matters: >-
      新聞說「某廠擴產 X 萬片」就是在講產能。晶圓廠蓋一座要好幾年、
      好幾千億，所以產能是提前兩三年決定的——這是半導體景氣循環的根源。

  process_node:
    term: 製程節點
    alias: [奈米, nm, 3 奈米, 5 奈米, 2 奈米, 先進製程, 成熟製程]
    category: 半導體製程
    one_liner: 用「幾奈米」來標示的製程世代，數字越小代表電晶體越密、同樣面積能塞越多運算能力。
    detail: >-
      現在的「3 奈米」「2 奈米」已經是行銷名稱，不是實際的物理尺寸。
      重點在於：越先進的製程，單位面積效能越高、耗電越低，但每片晶圓越貴、
      技術門檻越高。7 奈米以下通常叫「先進製程」，28 奈米以上叫「成熟製程」。
    why_it_matters: >-
      先進製程的毛利率遠高於成熟製程，而且全世界能做的公司只有兩三家。
      這就是為什麼同樣是「半導體股」，做先進製程和做成熟製程的公司，
      股價表現可以差非常多。

  foundry:
    term: 晶圓代工
    alias: [foundry, 代工廠]
    category: 產業分工
    one_liner: 只負責「照別人的設計把晶片做出來」，自己不設計也不賣終端產品。
    detail: >-
      客戶（IC 設計公司）給設計圖，代工廠把它變成實體晶片。
      台灣是全球晶圓代工的重鎮，這個商業模式本身就是台灣發明的。
    why_it_matters: >-
      代工廠的營收 = 客戶的訂單量。所以看代工廠要看它的客戶在做什麼，
      客戶砍單它就慘，客戶擴產它就旺。

  fabless:
    term: IC 設計（無晶圓廠）
    alias: [fabless, IC 設計公司]
    category: 產業分工
    one_liner: 只設計晶片，不自己蓋工廠，製造外包給晶圓代工廠。
    detail: >-
      因為不用蓋廠，資本支出低、毛利率高，但也代表產能要跟別人搶。
      國際上的 GPU、手機晶片大廠多屬此類。
    why_it_matters: >-
      缺產能的時候，IC 設計公司會被卡住出貨；產能過剩時它們反而有議價空間。
      「拿到多少 CoWoS 產能」這類新聞就是在講這件事。

  idm:
    term: IDM（整合元件製造）
    alias: [IDM]
    category: 產業分工
    one_liner: 從設計、製造到封測全部自己來的公司。
    detail: 記憶體大廠多半是 IDM。好處是垂直整合、掌控度高，壞處是資本支出極重。
    why_it_matters: IDM 的獲利對景氣循環特別敏感，因為工廠折舊是固定成本，不管有沒有訂單都要付。

  yield:
    term: 良率
    alias: [yield]
    category: 半導體製程
    one_liner: 做出來的晶片裡，有多少比例是能用的。
    detail: >-
      一片晶圓切出 100 顆，只有 70 顆能用，良率就是 70%。
      新製程剛量產時良率往往很低，隨著經驗累積慢慢拉高。
    why_it_matters: >-
      良率直接決定毛利率。同樣的成本做出更多能賣的晶片，錢就是這樣賺的。
      「良率不如預期」是很殺的利空。

  utilization:
    term: 產能利用率（稼動率）
    alias: [稼動率, utilization, 產能利用率]
    category: 半導體製程
    one_liner: 工廠開了多少產能出來用，滿載就是 100%。
    detail: 廠房折舊是固定的，開不開機都要攤提，所以利用率掉下來獲利會掉得更兇。
    why_it_matters: 這是判斷產業景氣冷熱最直接的數字，法說會一定會被問。

  # ==========================================================
  # 封裝測試與先進封裝
  # ==========================================================

  packaging:
    term: 封裝
    alias: [封測, 封裝測試, packaging, OSAT]
    category: 先進封裝
    one_liner: 把切下來的裸晶片裝進保護外殼、接上對外的腳位，讓它能被裝到電路板上。
    detail: >-
      晶圓切出來的晶片很脆弱而且沒有接腳，封裝就是替它做外殼和接線。
      測試則是確認它真的能用。專門做這件事的公司叫封測廠（OSAT）。
    why_it_matters: >-
      封裝過去被視為技術含量低的後段製程、毛利率不高。
      但先進封裝改變了這件事——見下一條。

  advanced_packaging:
    term: 先進封裝
    alias: [advanced packaging, 2.5D, 3D 封裝, 異質整合]
    category: 先進封裝
    one_liner: 把好幾顆不同的晶片，用非常精密的方式疊在一起或並排整合成「一顆」。
    detail: >-
      傳統封裝是「一顆晶片一個殼」。先進封裝是把運算晶片、記憶體等
      多顆晶片整合在同一個封裝體裡，讓它們之間的距離極短、傳輸極快。
      為什麼要這樣做：製程微縮越來越貴也越來越難，
      靠「把東西擺得更近」來提升效能，比「把電晶體做得更小」划算。
    why_it_matters: >-
      這是近年最重要的產業轉變之一。它讓原本的後段製程變成關鍵瓶頸，
      也把一批原本不起眼的封裝、載板、設備公司推到聚光燈下。

  cowos:
    term: CoWoS
    alias: [CoWoS, Chip on Wafer on Substrate]
    category: 先進封裝
    one_liner: 一種先進封裝技術，把運算晶片和高頻寬記憶體並排放在同一塊中介層上。
    detail: >-
      名字直翻是「晶片疊在晶圓上、晶圓再疊在基板上」。
      關鍵在中間那層「中介層（interposer）」，它提供極密集的線路，
      讓運算晶片和記憶體之間能超高速溝通。AI 加速器幾乎都靠這類技術。
    why_it_matters: >-
      這類產能一度是 AI 晶片出貨的最大瓶頸——晶片本身做得出來，
      但封裝不夠就是出不了貨。所以「擴產多少」會直接牽動一整條供應鏈的股價。

  hbm:
    term: HBM（高頻寬記憶體）
    alias: [HBM, 高頻寬記憶體]
    category: 記憶體
    one_liner: 把多層 DRAM 垂直堆疊起來的記憶體，緊貼在運算晶片旁邊，頻寬遠高於一般記憶體。
    detail: >-
      AI 運算的瓶頸常常不是「算得不夠快」，而是「資料餵不進來」。
      HBM 就是為了解決餵資料的速度問題，代價是很貴、很難做、良率不好拉。
    why_it_matters: AI 伺服器的成本結構裡 HBM 佔比很高，它的供需是重要觀察指標。

  substrate:
    term: IC 載板
    alias: [載板, IC Substrate, ABF, ABF 載板, BT 載板]
    category: PCB / 載板
    one_liner: 晶片和電路板之間的那塊「轉接板」，把晶片上極細的接點放大到電路板能焊接的尺寸。
    detail: >-
      晶片上的接點間距是微米等級，主機板上的是毫米等級，中間需要一個
      層層過渡的載板。ABF 和 BT 是兩種主要材料：ABF 用在高階、腳位多、
      發熱大的晶片（如 CPU、GPU、AI 加速器），BT 多用在手機晶片、記憶體。
    why_it_matters: >-
      ABF 載板在 AI 需求爆發時曾嚴重供不應求，因為它層數多、面積大、
      良率難拉、擴產要三年。這是典型的「小零件卡住大產業」。

  # ==========================================================
  # PCB
  # ==========================================================

  pcb:
    term: PCB（印刷電路板）
    alias: [PCB, 印刷電路板, 電路板]
    category: PCB / 載板
    one_liner: 電子產品裡那塊綠色（或其他顏色）的板子，負責把所有零件接起來並固定住。
    detail: >-
      幾乎所有電子產品都有。它本身是「銅箔 + 絕緣層」層層壓合，
      再蝕刻出線路。層數越多、線路越細，技術難度和價格越高。
      台灣是全球 PCB 產業的重要基地。
    why_it_matters: >-
      PCB 是個很分散的產業，從幾塊錢的簡單板到上萬元的高階板都有，
      所以「PCB 類股」內部差異極大。看到「PCB 漲」要問的是：
      漲的是哪一種板？做低階板的公司跟做 AI 伺服器高階板的公司完全是兩回事。

  hdi:
    term: HDI 板
    alias: [HDI, 高密度連接板]
    category: PCB / 載板
    one_liner: 線路做得特別細密的高階 PCB，讓同樣面積能塞下更多零件。
    detail: 手機、筆電這類「要塞很多東西進小空間」的產品會用到。做法上會用雷射鑽孔等更精密的工法。
    why_it_matters: 附加價值比一般 PCB 高，是 PCB 廠往上升級的方向之一。

  ccl:
    term: 銅箔基板（CCL）
    alias: [CCL, 銅箔基板]
    category: PCB / 載板
    one_liner: PCB 的原料——一層銅箔壓在絕緣材料上，再拿去做成電路板。
    detail: 高頻高速的應用（AI 伺服器、5G）需要特殊材料的 CCL，訊號跑得快又不失真，價格高很多。
    why_it_matters: 屬於上游材料。AI 帶動的是「高階 CCL」的需求，不是所有 CCL 都受惠。

  fpc:
    term: 軟板（FPC）
    alias: [FPC, 軟板, 軟性電路板]
    category: PCB / 載板
    one_liner: 可以彎折的電路板，用在需要折疊或塞進不規則空間的地方。
    detail: 手機的相機模組、折疊螢幕、穿戴裝置大量使用。
    why_it_matters: 軟板廠的營收跟消費性電子（尤其手機）的出貨週期綁得很緊，季節性明顯。

  # ==========================================================
  # AI 伺服器供應鏈
  # ==========================================================

  ai_server:
    term: AI 伺服器
    alias: [AI server, AI 伺服器, 加速運算伺服器]
    category: AI 伺服器
    one_liner: 專門用來訓練和執行 AI 模型的高階伺服器，裡面裝滿了 GPU 或專用加速晶片。
    detail: >-
      跟一般伺服器最大的差別是耗電和發熱極高，所以電源、散熱、機構件
      都要重新設計，整台的價格可以是一般伺服器的十幾二十倍。
    why_it_matters: >-
      它帶動的不只是晶片，還有電源、散熱、機殼、線材、交換器、光通訊——
      一整條台灣廠商很密集的供應鏈。這是近年台股結構性行情的主軸之一。

  odm:
    term: ODM / 代工組裝
    alias: [ODM, EMS, 代工廠, 組裝廠]
    category: 產業分工
    one_liner: 替品牌客戶設計並組裝整台產品的公司。
    detail: 營收規模很大但毛利率通常很薄（常見個位數），賺的是規模和效率。
    why_it_matters: >-
      看 ODM 要特別注意「營收成長」和「獲利成長」可能脫節——
      接了大單但毛利被壓縮的情況很常見。

  liquid_cooling:
    term: 液冷散熱
    alias: [液冷, 水冷, liquid cooling]
    category: AI 伺服器
    one_liner: 用液體而不是風扇來帶走熱量的散熱方式。
    detail: AI 晶片發熱量高到風扇吹不動，只好改用液體循環。整套包含冷卻板、管路、分配單元。
    why_it_matters: 這是 AI 伺服器衍生出來的新需求，原本做散熱模組的公司因此有了價值更高的產品線。

  optical_module:
    term: 光模組 / 光通訊
    alias: [光模組, 矽光子, 光收發模組, CPO]
    category: AI 伺服器
    one_liner: 把電訊號轉成光訊號傳輸的元件，用在資料中心裡機櫃跟機櫃之間的高速連接。
    detail: AI 訓練需要成千上萬顆晶片同時協作，彼此之間的傳輸速度成為瓶頸，光通訊就是解法。
    why_it_matters: 資料中心規模越大，互連需求成長得比晶片數量還快。

  # ==========================================================
  # 記憶體與被動元件
  # ==========================================================

  dram:
    term: DRAM
    alias: [DRAM, 動態隨機存取記憶體]
    category: 記憶體
    one_liner: 電腦的「工作桌面」，斷電就清空，速度快，用來暫存正在處理的資料。
    detail: 標準化程度高、供應商少，價格由供需決定，是典型的循環性產業。
    why_it_matters: DRAM 報價是公開的，漲跌會直接反映在相關公司的獲利上，波動非常大。

  nand:
    term: NAND Flash
    alias: [NAND, 快閃記憶體, SSD]
    category: 記憶體
    one_liner: 電腦的「檔案櫃」，斷電資料還在，容量大但速度比 DRAM 慢。
    detail: SSD、手機儲存空間、記憶卡都是它。
    why_it_matters: 跟 DRAM 一樣是報價型產業，但循環週期不一定同步。

  mlcc:
    term: MLCC（積層陶瓷電容）
    alias: [MLCC, 被動元件, 電容]
    category: 被動元件
    one_liner: 電路上到處都是的微小零件，負責穩定電流、濾掉雜訊。
    detail: 一支手機用上千顆，一台車用上萬顆。單價極低但用量極大。
    why_it_matters: >-
      因為到處都用得到，MLCC 的需求可以當成整體電子業景氣的溫度計。
      缺貨時價格會暴漲，這種行情叫「漲價題材」。

  # ==========================================================
  # 財務數字：法說會和財報在講什麼
  # ==========================================================

  gross_margin:
    term: 毛利率
    alias: [毛利率, gross margin, GM]
    category: 財務
    one_liner: 賣 100 元的東西，扣掉「做出它的直接成本」後還剩幾元。
    detail: >-
      反映的是產品本身值不值錢、有沒有議價能力。
      同一家公司毛利率走升，通常代表產品組合往高階走，或成本控制變好。
    why_it_matters: >-
      營收成長但毛利率下滑，代表「賣得多但賺得少」，
      這是很多「營收創新高卻股價下跌」的原因。

  operating_margin:
    term: 營業利益率
    alias: [營益率, 營業利益率, OPM]
    category: 財務
    one_liner: 毛利再扣掉研發、行銷、管理等營運費用後，剩下的比例。
    detail: 比毛利率更接近「本業真正賺多少」。
    why_it_matters: 有些公司毛利率高但研發燒很兇，營益率才看得出本業體質。

  eps:
    term: EPS（每股盈餘）
    alias: [EPS, 每股盈餘]
    category: 財務
    one_liner: 公司賺的錢除以總股數，等於「你手上每一股幫你賺了多少」。
    detail: 台股習慣看單季和全年 EPS。
    why_it_matters: 股價常被拿來跟 EPS 相比（見「本益比」），是最常被引用的獲利指標。

  pe_ratio:
    term: 本益比（PE）
    alias: [本益比, PE, P/E, 倍數]
    category: 財務
    one_liner: 股價 ÷ 每股盈餘。白話說：照現在的獲利水準，幾年能把你買它的錢賺回來。
    detail: >-
      本益比 20 倍 = 用 20 年的獲利買下它。數字高代表市場願意為它的
      「未來」多付錢，低則相反。但高低沒有絕對標準——
      成長快的產業本來就該享有比較高的倍數，景氣循環股在獲利最好的時候
      本益比反而看起來最低（因為市場預期獲利要往下了）。
    why_it_matters: >-
      「為什麼股價這麼高」最常見的答案就是本益比擴張——
      獲利沒變多，但市場願意付更高的倍數。這種漲勢比獲利驅動的脆弱。

  pb_ratio:
    term: 股價淨值比（PB）
    alias: [PB, 股價淨值比, 淨值比]
    category: 財務
    one_liner: 股價 ÷ 每股淨值。衡量你付的價格是帳面資產的幾倍。
    detail: 對資產很重的行業（金融、航運、鋼鐵）比較有參考價值。
    why_it_matters: 獲利大起大落的循環股，用 PB 有時比 PE 穩定。

  roe:
    term: ROE（股東權益報酬率）
    alias: [ROE, 股東權益報酬率]
    category: 財務
    one_liner: 公司用股東的錢，一年能生出多少報酬。
    detail: 長期維持高 ROE 通常代表有真正的競爭優勢，而不只是景氣好。
    why_it_matters: 這是判斷「好公司」比較耐用的指標之一，但要看長期趨勢而非單一年度。

  yoy:
    term: 年增率（YoY）／月增率（MoM）
    alias: [YoY, MoM, 年增率, 月增率, 年增, 月增]
    category: 財務
    one_liner: YoY 是跟去年同期比，MoM 是跟上個月比。
    detail: >-
      YoY 排除掉季節性（例如電子業第四季本來就旺），比較能看出真實成長。
      MoM 反映短期動能。台股每月 10 號前公布上月營收，是很受關注的數字。
    why_it_matters: 「營收年增 50%」和「營收月增 5%」是完全不同量級的資訊，別混著看。

  dividend_yield:
    term: 現金殖利率
    alias: [殖利率, 現金殖利率, dividend yield]
    category: 財務
    one_liner: 一年配的現金股利 ÷ 股價。你買進後，光靠配息一年能拿回幾 %。
    detail: >-
      股價漲，殖利率就下降（同樣的配息、更貴的成本）。
      所以「高殖利率」有時是因為公司好，有時只是因為股價跌了。
    why_it_matters: 存股族的核心指標，但要確認配息是不是可持續的，而不是一次性的。

  earnings_call:
    term: 法說會
    alias: [法說會, 法人說明會, 財報會議]
    category: 財務
    one_liner: 公司對法人和媒體說明營運狀況、回答提問的會議。
    detail: >-
      重點通常不在已經公布的財報數字，而在管理層對**下一季的展望**，
      以及對資本支出、產能、需求的說法。
    why_it_matters: >-
      股價常常在法說會後大幅波動，因為市場交易的是預期。
      「財報很好但股價大跌」多半是因為展望不如預期。

  # ==========================================================
  # 台股制度
  # ==========================================================

  etf:
    term: ETF（指數股票型基金）
    alias: [ETF, 指數股票型基金]
    category: 台股制度
    one_liner: 一籃子股票包成一檔，買一張等於同時買進裡面所有成分股。
    detail: >-
      追蹤大盤的（如台灣 50）買的是市值最大的那些公司；
      高股息 ETF 則是照配息條件去篩選成分股。
      內扣費用會每天從淨值裡扣掉，不會另外跟你收。
    why_it_matters: 分散風險、不用選股，但也意味著你買到的是一整籃，好壞都在裡面。

  etf_premium:
    term: ETF 折溢價
    alias: [折溢價, 溢價, 折價]
    category: 台股制度
    one_liner: ETF 的「市場成交價」和它「真正的資產淨值」之間的差距。
    detail: >-
      溢價 = 你付的價格比它實際值的錢還高；折價則相反。
      正常情況下差距很小，但在某檔 ETF 特別熱門、大家搶著買的時候，
      溢價可能拉大到幾個百分點。
    why_it_matters: >-
      用溢價買進等於一開始就先虧那幾 %，溢價收斂時會反映到你的損益上。
      買 ETF 前看一眼折溢價是很便宜的保護。

  ex_dividend:
    term: 除權息
    alias: [除權息, 除息, 除權, 填息]
    category: 台股制度
    one_liner: 配息當天股價會直接扣掉配息金額，所以你不會因為配息而平白多賺。
    detail: >-
      配 3 元，股價就從 100 變成 97，你多了 3 元現金但股票少值 3 元，
      當下是零和的。之後股價漲回 100 叫「填息」，那才是真的賺到。
      沒填息的話，配息只是把你自己的錢還給你，還要繳稅。
    why_it_matters: >-
      這是新手最容易誤解的地方。「高配息」本身不創造報酬，
      能不能填息才是重點。

  institutional:
    term: 三大法人
    alias: [三大法人, 外資, 投信, 自營商, 法人]
    category: 台股制度
    one_liner: 外資、投信（國內基金）、自營商（券商自有資金）三類機構投資人。
    detail: >-
      每天收盤後會公布它們各買賣了多少。外資部位最大、對權值股影響最明顯；
      投信有作帳壓力（季底、年底），自營商偏短線。
    why_it_matters: >-
      常被當成風向指標，但要小心：法人也會看錯，而且公布的是「已經發生」
      的交易。拿它當唯一依據追買追賣，通常是在追高殺低。

  margin_trading:
    term: 融資融券
    alias: [融資, 融券, 券資比, 融資餘額]
    category: 台股制度
    one_liner: 融資是借錢買股票，融券是借股票來賣。都是槓桿操作。
    detail: 融資餘額高代表散戶押注多，行情反轉時容易出現斷頭賣壓（被強制賣出）。
    why_it_matters: 「融資減肥」「軋空」這類新聞說的就是這個籌碼結構的變化。

  limit_move:
    term: 漲跌停
    alias: [漲停, 跌停, 漲跌停]
    category: 台股制度
    one_liner: 台股單日漲跌幅限制在 10%，碰到就不能再往上或往下成交。
    detail: 跌停時常常買盤消失、掛著賣不掉，這是流動性風險最直接的體現。
    why_it_matters: 停損設在 8%，如果隔天直接跳空跌停，你實際出場的價格會比停損線差很多。

  # ==========================================================
  # 其他產業
  # ==========================================================

  container_shipping:
    term: 貨櫃航運
    alias: [貨櫃航運, 航運, SCFI, 運價指數]
    category: 航運
    one_liner: 用貨櫃船運送商品的生意，運價隨供需大起大落。
    detail: >-
      SCFI（上海出口貨櫃運價指數）是最常被引用的運價指標，每週公布。
      船的供給是幾年前訂的（造船要好幾年），需求卻隨全球貿易快速變動，
      所以供需極容易失衡——這就是航運股暴漲暴跌的結構性原因。
    why_it_matters: >-
      航運是典型的景氣循環股。獲利最好、本益比看起來最低的時候，
      往往就是最接近高點的時候。用一般成長股的邏輯看它會吃大虧。

  arpu:
    term: ARPU（每用戶平均收入）
    alias: [ARPU]
    category: 電信
    one_liner: 平均每個用戶一個月貢獻多少營收。
    detail: 電信業用戶數接近飽和之後，成長主要來自把 ARPU 拉高（升級方案、加值服務）。
    why_it_matters: 電信股的成長性有限但現金流穩定，這是它被當成「定存股」的原因。
