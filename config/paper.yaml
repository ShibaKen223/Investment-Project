# ============================================================
# 模擬倉（paper trading）設定
# ============================================================
# 這裡的一切都是虛擬的：沒有連任何券商，不會有任何真實委託送出去。
# 目的是先累積幾個月「這套規則實際上會做什麼決定」的證據，
# 再決定要不要用真錢。
#
# ⚠️ 改參數之前先看 data/paper_equity.jsonl。
#    看到虧損就調鬆停損、看到獲利就調緊停利，是最常見的自我欺騙路徑——
#    你會得到一組在歷史上很漂亮、對未來毫無預測力的參數。
#    要改就在 changelog 留一行，跟 strategy.yaml 一樣的規矩。
# ------------------------------------------------------------

enabled: true

# ------------------------------------------------------------
# 資金與部位管理
# ------------------------------------------------------------
account:
  initial_cash: 1000000    # 初始虛擬資金
  position_pct: 20.0       # 每檔投入淨值的 %（20% → 最多同時 5 檔滿倉）
  max_positions: 5         # 同時持有的檔數上限

# ------------------------------------------------------------
# 交易成本 —— 照台股實況，不要調鬆
# ------------------------------------------------------------
# 來回成本約 0.47%：這個數字決定了「多小的波段不值得做」。
# 停利設 15% 而不是 3%，一部分原因就在這裡。
costs:
  fee_rate: 0.001425       # 手續費法定上限
  fee_discount: 0.6        # 你的券商折扣（6 折＝0.6；不確定就填 1.0）
  fee_minimum: 20          # 每筆最低手續費
  tax_rate: 0.003          # 證交稅（賣出才收）。ETF 是 0.001
  slippage_pct: 0.1        # 滑價假設：實際成交價比開盤價差 0.1%

# ------------------------------------------------------------
# 策略參數 —— 1～2 週波段
# ------------------------------------------------------------
# 進場要四個條件同時成立（順勢 + 動能 + 突破 + 流動性）。
# 條件多不是因為比較準，是因為要少交易：每次進出都要付 0.47%。
strategy:
  # 進場
  trend_ma: 60             # 收盤要站上 60 日均線（長期趨勢過濾，不逆勢接刀）
  momentum_ma: 20          # 收盤要站上 20 日均線（中期動能）
  breakout_lookback: 20    # 要突破前 20 日的最高價
  min_avg_volume: 500000   # 近 20 日均量下限（股數）＝ 500 張
  volume_ma: 20

  # 出場
  # stop_mode 決定停損停利怎麼算:
  #   pct = 固定百分比，每檔一視同仁
  #   atr = N 倍 ATR，停損寬度自動跟著各股的波動度調整
  #
  # 為什麼會想換成 atr：固定 8% 對每檔都一樣，但一檔日常波動 1% 的電信股
  # 和一檔波動 5% 的航運股，8% 的意義完全不同——前者要跌很久才碰得到，
  # 後者兩天的正常震盪就把你掃出場了。
  # 想知道某檔的 ATR 有多大，看「研究」分頁，它會直接換算成百分比給你看。
  stop_mode: pct

  # stop_mode: pct 時用這兩個
  stop_loss_pct: 8.0       # 自進場成交價起算
  take_profit_pct: 15.0

  # stop_mode: atr 時用這三個。停損寬度在進場當下就固定，之後不會變動——
  # 會移動的停損線沒辦法讓你在進場前算出這筆最多會賠多少。
  atr_period: 14
  atr_stop_multiple: 2.0     # 停損 = 進場價 − 2 × ATR
  atr_target_multiple: 3.5   # 停利 = 進場價 + 3.5 × ATR（風報比 1:1.75）

  max_hold_bars: 15        # 抱滿 15 根 K 還沒觸發就走 —— 這條是「波段」的定義
  trailing_stop_pct: 0.0   # 設 >0 才啟用移動停損（例如 10.0）

changelog:
  - date: "2026-08-20"
    note: "初版：1～2 週波段突破策略，模擬倉 100 萬、每檔 20%、最多 5 檔。"
