# ============================================================
# 模擬倉（paper trading）設定
# ============================================================
# 這裡的一切都是虛擬的：沒有連任何券商，不會有任何真實委託送出去。
# 目的是先累積幾個月「這套規則實際上會做什麼決定」的證據，
# 再決定要不要用真錢。
#
# ⚠️ 改參數之前先看 data/paper_equity.jsonl。
#    看到虧損就調鬆停損、看到獲利就調緊停利，是最常見的自我欺騙路徑——
#    你會得到一組在歷史上很漂亮、對未來毫無預測力的參數。
#    要改就在 changelog 留一行，跟 strategy.yaml 一樣的規矩。
# ------------------------------------------------------------

enabled: true

# ------------------------------------------------------------
# 資金與部位管理
# ------------------------------------------------------------
account:
  initial_cash: 1000000    # 初始虛擬資金
  # ⚠️ 這兩個要一起看：position_pct × max_positions ＝ 總曝險上限。
  #    只改其中一個，曝險上限就會悄悄變成別的數字（10 檔 × 20% ＝ 200%，
  #    這套系統做不到槓桿，實際會變成「前 5 檔吃光現金、後 5 檔全買不到」）。
  #    改的理由見下面 2026-09-04 的 changelog 與 docs/position-count-sweep.md。
  position_pct: 10.0       # 每檔投入淨值的 %（10% → 最多同時 10 檔滿倉）
  max_positions: 10        # 同時持有的檔數上限

  # 最小交易單位（股）。1000 = 只能買整張；1 = 開放零股（盤中零股交易）。
  #
  # ⚠️ 下面這段的數字是 2026-09-02 寫的，那時每檔部位是 20%（預算 20 萬）。
  #    2026-09-04 改成 10% 之後預算變 10 萬，買不起整張的標的只會更多，
  #    所以這段的論證只有變強、沒有變弱。數字保留原樣不改寫——
  #    它記錄的是當初的決策依據，不是現在的設定值。
  #
  # 為什麼改成 1：預算是 100 萬 × 20% = 20 萬，但觀察清單 54 檔裡有 30 檔
  # 一張就超過 20 萬（2330 一張 244 萬、6669 一張 780 萬），14 檔連整個
  # 帳戶都買不起。訊號成立也永遠買不到，實際成交的只剩金控、航運、塑化、
  # 電信——選股原則寫的是 AI 供應鏈，回測測的是另一個標的池。
  #
  # 而且它會自己惡化：回測 65 萬淨利裡有 41.6 萬（64%）來自 1303、2408、
  # 3711、2317、6213、3037，這幾檔都是「買進時買得起、現在已經買不起」的。
  # 只留今天買得起的 24 檔重跑，報酬 65.51% → 14.74%、報酬/回撤 1.70
  # 輸給基準。贏家漲到買不起了，這個帳戶往前看只剩貢獻 36% 損益的那批。
  #
  # 零股不會讓部位變大或變小，只是讓「20% 部位」真的能被執行：
  # 7580 元的股票買 26 股 ≈ 19.7 萬，正好是本來就打算投的金額。
  #
  # ⚠️ 兩個誠實面對的假設：
  #   1. 成交價仍用隔日開盤價。盤中零股是 09:10 起每分鐘集合競價，
  #      跟整股開盤不是同一個價。大型股差距很小，冷門股會更差。
  #   2. 零股簿子比整股薄。滑價仍沿用 slippage_pct，沒有另外加碼——
  #      沒有資料可以支持一個更大的數字，所以寧可把假設寫在這裡，
  #      也不要憑感覺編一個看起來比較保守的參數。
  trade_unit: 1

  # 低於這個金額就不開新部位（0 = 不檢查）。
  # 零股讓「買 1 股」變成可能，而手續費有 20 元最低收費：
  # 2000 元的部位來回要付 20+20+6 = 46 元 ＝ 2.3%，對一套停損 8%、
  # 停利 15% 的策略來說，那筆交易從第一天就輸了。
  # 抓 3 萬元：來回成本約 0.55%，跟整張部位的 0.47% 在同一個量級。
  min_position_value: 30000

# ------------------------------------------------------------
# 交易成本 —— 照台股實況，不要調鬆
# ------------------------------------------------------------
# 來回成本約 0.47%：這個數字決定了「多小的波段不值得做」。
# 停利設 15% 而不是 3%，一部分原因就在這裡。
costs:
  fee_rate: 0.001425       # 手續費法定上限
  fee_discount: 0.6        # 你的券商折扣（6 折＝0.6；不確定就填 1.0）
  fee_minimum: 20          # 每筆最低手續費
  tax_rate: 0.003          # 證交稅（賣出才收）。ETF 是 0.001
  slippage_pct: 0.1        # 滑價假設：實際成交價比開盤價差 0.1%

# ------------------------------------------------------------
# 策略參數 —— 1～2 週波段
# ------------------------------------------------------------
# 進場要四個條件同時成立（順勢 + 動能 + 突破 + 流動性）。
# 條件多不是因為比較準，是因為要少交易：每次進出都要付 0.47%。
strategy:
  # 進場
  trend_ma: 60             # 收盤要站上 60 日均線（長期趨勢過濾，不逆勢接刀）
  momentum_ma: 20          # 收盤要站上 20 日均線（中期動能）
  breakout_lookback: 20    # 要突破前 20 日的最高價
  min_avg_volume: 500000   # 近 20 日均量下限（股數）＝ 500 張
  volume_ma: 20

  # 出場
  # stop_mode 決定停損停利怎麼算:
  #   pct = 固定百分比，每檔一視同仁
  #   atr = N 倍 ATR，停損寬度自動跟著各股的波動度調整
  #
  # 為什麼會想換成 atr：固定 8% 對每檔都一樣，但一檔日常波動 1% 的電信股
  # 和一檔波動 5% 的航運股，8% 的意義完全不同——前者要跌很久才碰得到，
  # 後者兩天的正常震盪就把你掃出場了。
  # 想知道某檔的 ATR 有多大，看「研究」分頁，它會直接換算成百分比給你看。
  stop_mode: pct

  # stop_mode: pct 時用這兩個
  stop_loss_pct: 8.0       # 自進場成交價起算
  take_profit_pct: 15.0

  # stop_mode: atr 時用這三個。停損寬度在進場當下就固定，之後不會變動——
  # 會移動的停損線沒辦法讓你在進場前算出這筆最多會賠多少。
  atr_period: 14
  atr_stop_multiple: 2.0     # 停損 = 進場價 − 2 × ATR
  atr_target_multiple: 3.5   # 停利 = 進場價 + 3.5 × ATR（風報比 1:1.75）

  max_hold_bars: 15        # 抱滿 15 根 K 還沒觸發就走 —— 這條是「波段」的定義
  trailing_stop_pct: 0.0   # 設 >0 才啟用移動停損（例如 10.0）

# ------------------------------------------------------------
# 資料充足度保護
# ------------------------------------------------------------
# 資料還沒到齊就跑，得到的「今天沒有訊號」是假的——它只代表沒東西可看，
# 而系統會把那一天當成處理完畢記下來，之後補了歷史也回不去。
#
# 實際發生過：2026-08-20 早上執行時 data/history/ 幾乎是空的，
# 掃描池 40 檔沒幾檔有 61 根 K，所以「沒有訊號」；當天稍晚補齊歷史後重算，
# 2603 其實是成立的（突破前 20 日高點 242，收 246）——但那一天已經被鎖住了。
#
# 現在低於門檻就整段不算數：不成交、不寫 last_date、不記淨值，
# 補完資料重跑同一天會補回來。
data_guard:
  min_ready_codes: 10      # 至少要幾檔「資料足夠」才算數。設 0 = 關掉保護（不建議）

changelog:
  - date: "2026-08-20"
    note: "初版：1～2 週波段突破策略，模擬倉 100 萬、每檔 20%、最多 5 檔。"
  - date: "2026-08-21"
    note: "加入 data_guard：資料不足時整天不算數，避免空轉的那天被永久鎖住。策略參數未動。"
  - date: "2026-09-04"
    note: >-
      max_positions 5 → 10、position_pct 20% → 10%。兩個一起改，
      所以**總曝險上限沒有變**（5 × 20% 和 10 × 10% 都是 100%）：
      變的是同一筆錢分成幾份，不是投多少錢進去。

      這是動交易參數，而 strategy.yaml 的 objective 寫著 2027-02 前不改。
      以下是為什麼現在改不算違規，以及為什麼它不是搬門柱。

      **凍結那條規則防的是「看到損益結果之後去調參數」，而此刻
      data/paper_trades.jsonl 還不存在——已平倉交易數是 0。**
      沒有任何實跑結果可以污染這個決定。反過來說，等到 10 月、
      二十幾筆進去之後再改，那時才是真的要把樣本丟掉重來。
      現在是這個參數最便宜的修改時機，晚改只會更貴。

      起因不是損益，是落選紀錄：訊號成立卻因為「同時持有上限為 5 檔」
      被擋掉的，8/28 一檔（3324）、9/01 兩檔（2884、0050）、
      9/04 三檔（3324、3017、2382），在變密。
      注意 8/28 的 3324 是「名額不足」不是「買不起」——名額限制卡標的
      比開放零股（9/02）還早，這兩件事是分開的。
      paper.py 特意保留這些落選紀錄，註解寫的就是「這是你調整
      max_positions 的依據」；這次就是那一天。

      而 max_positions: 5 從 2026-08-20 初版就是這個數字，**從來沒有被測過**。
      為了測它，backtest.py 加了 --max-positions / --position-pct 兩個
      只覆寫單次執行的旗標，所以整個掃描過程沒有動到這份設定檔，
      也沒有碰到帳本。完整結果見 docs/position-count-sweep.md。

      掃描結果（2024-09-02 ~ 2026-09-04，488 個交易日，策略參數全程不動，
      所有配置都固定曝險上限 100%），報酬/最大回撤：
      5 檔 4.10、6 檔 4.68、7 檔 5.42、8 檔 6.10、9 檔 6.41、10 檔 6.00、
      12 檔 5.03（0050 同期基準 5.41）。
      10 檔對 5 檔：報酬 79.22% vs 70.60%、最大回撤 −13.20% vs −17.22%、
      獲利因子 1.55 vs 1.47、涵蓋標的 43 檔 vs 37 檔。
      objective 那七條門檻，10 檔全過，**而現行的 5 檔只過五條**
      （獲利因子 1.47 < 1.5、報酬/回撤 4.10 < 基準 5.41 兩條不過）。
      也就是說這不是「把一個及格的設定換成更好的」，
      是「現在跑的這個設定本來就沒過自己的標準」。

      報酬和回撤同時改善不是常見的取捨結果，原因要說清楚：
      **動能排名（_rank_key）沒有展現出選股能力。** 如果排名 1–5 真的優於
      6–10，擴大檔數應該要用報酬換波動；實際上勝率反而從 51.7% 升到 52.7%。
      所以 5 檔上限的作用不是「只挑最好的」，是單純少下注——
      把正期望值的機會丟掉，同時把錢壓在更少標的上放大波動。

      **為什麼選 10 而不是曲線頂點的 9：** 挑最高那一格正是這份檔案開頭
      警告的自我欺騙。把期間對半切之後，8 和 10 誰贏會翻面（前半 8 贏、
      後半 10 贏），這份資料分不出 7～10 之間的高下，只能說那是一段高原。
      在分不出來的區間裡選 10，理由是它的涵蓋標的最多（43 檔），
      而 objective 要求樣本「分布於 ≥ 15 檔」——選檔數多的那端
      是為了讓樣本條件早點達成，不是因為它的報酬數字比較好看。

      **這份證據撐不起的結論**（寫在這裡，免得日後被當成更強的證據）：
      不是樣本外，這兩年就是策略參數當初調出來的同一段資料；
      整段都是多頭（0050 同期 +148.60%），崩盤時相關性會一起衝到 1，
      分散效果會比這張表小，而資料裡沒有崩盤可以驗證；
      12 檔為什麼掉下來沒有查，別拿猜測當結論。

      **完全沒有處理產業集中。** 引擎只看動能不看產業，10 檔全是金控的話，
      檔數變多不等於分散。config/sectors.yaml 有現成的 sector 欄位可用，
      但那是另一件事，刻意不跟這次綁在一起改——兩個變數一起動，
      之後沒辦法歸因是哪一個造成的差異。

      **過渡期要注意：** position_pct 只影響新進場，現有 5 檔仍是 20% 大小，
      不會被重新調整，所以會有一段新舊部位大小混雜的時期，覆盤時要記得。
      而且改的當下現金只剩 73,063，低於新的每檔上限（淨值 10% ≈ 10.5 萬），
      所以接下來一兩檔會是偏小的部位——這不是錯誤，等現有部位觸發
      max_hold_bars（15 根 K）陸續出場、現金回來之後就會回到正常大小。
