# ============================================================
# 模擬倉（paper trading）設定
# ============================================================
# 這裡的一切都是虛擬的：沒有連任何券商，不會有任何真實委託送出去。
# 目的是先累積幾個月「這套規則實際上會做什麼決定」的證據，
# 再決定要不要用真錢。
#
# ⚠️ 改參數之前先看 data/paper_equity.jsonl。
#    看到虧損就調鬆停損、看到獲利就調緊停利，是最常見的自我欺騙路徑——
#    你會得到一組在歷史上很漂亮、對未來毫無預測力的參數。
#    要改就在 changelog 留一行，跟 strategy.yaml 一樣的規矩。
# ------------------------------------------------------------

enabled: true

# ------------------------------------------------------------
# 資金與部位管理
# ------------------------------------------------------------
account:
  initial_cash: 1000000    # 初始虛擬資金
  position_pct: 20.0       # 每檔投入淨值的 %（20% → 最多同時 5 檔滿倉）
  max_positions: 5         # 同時持有的檔數上限

  # 最小交易單位（股）。1000 = 只能買整張；1 = 開放零股（盤中零股交易）。
  #
  # 為什麼改成 1：預算是 100 萬 × 20% = 20 萬，但觀察清單 54 檔裡有 30 檔
  # 一張就超過 20 萬（2330 一張 244 萬、6669 一張 780 萬），14 檔連整個
  # 帳戶都買不起。訊號成立也永遠買不到，實際成交的只剩金控、航運、塑化、
  # 電信——選股原則寫的是 AI 供應鏈，回測測的是另一個標的池。
  #
  # 而且它會自己惡化：回測 65 萬淨利裡有 41.6 萬（64%）來自 1303、2408、
  # 3711、2317、6213、3037，這幾檔都是「買進時買得起、現在已經買不起」的。
  # 只留今天買得起的 24 檔重跑，報酬 65.51% → 14.74%、報酬/回撤 1.70
  # 輸給基準。贏家漲到買不起了，這個帳戶往前看只剩貢獻 36% 損益的那批。
  #
  # 零股不會讓部位變大或變小，只是讓「20% 部位」真的能被執行：
  # 7580 元的股票買 26 股 ≈ 19.7 萬，正好是本來就打算投的金額。
  #
  # ⚠️ 兩個誠實面對的假設：
  #   1. 成交價仍用隔日開盤價。盤中零股是 09:10 起每分鐘集合競價，
  #      跟整股開盤不是同一個價。大型股差距很小，冷門股會更差。
  #   2. 零股簿子比整股薄。滑價仍沿用 slippage_pct，沒有另外加碼——
  #      沒有資料可以支持一個更大的數字，所以寧可把假設寫在這裡，
  #      也不要憑感覺編一個看起來比較保守的參數。
  trade_unit: 1

  # 低於這個金額就不開新部位（0 = 不檢查）。
  # 零股讓「買 1 股」變成可能，而手續費有 20 元最低收費：
  # 2000 元的部位來回要付 20+20+6 = 46 元 ＝ 2.3%，對一套停損 8%、
  # 停利 15% 的策略來說，那筆交易從第一天就輸了。
  # 抓 3 萬元：來回成本約 0.55%，跟整張部位的 0.47% 在同一個量級。
  min_position_value: 30000

# ------------------------------------------------------------
# 交易成本 —— 照台股實況，不要調鬆
# ------------------------------------------------------------
# 來回成本約 0.47%：這個數字決定了「多小的波段不值得做」。
# 停利設 15% 而不是 3%，一部分原因就在這裡。
costs:
  fee_rate: 0.001425       # 手續費法定上限
  fee_discount: 0.6        # 你的券商折扣（6 折＝0.6；不確定就填 1.0）
  fee_minimum: 20          # 每筆最低手續費
  tax_rate: 0.003          # 證交稅（賣出才收）。ETF 是 0.001
  slippage_pct: 0.1        # 滑價假設：實際成交價比開盤價差 0.1%

# ------------------------------------------------------------
# 策略參數 —— 1～2 週波段
# ------------------------------------------------------------
# 進場要四個條件同時成立（順勢 + 動能 + 突破 + 流動性）。
# 條件多不是因為比較準，是因為要少交易：每次進出都要付 0.47%。
strategy:
  # 進場
  trend_ma: 60             # 收盤要站上 60 日均線（長期趨勢過濾，不逆勢接刀）
  momentum_ma: 20          # 收盤要站上 20 日均線（中期動能）
  breakout_lookback: 20    # 要突破前 20 日的最高價
  min_avg_volume: 500000   # 近 20 日均量下限（股數）＝ 500 張
  volume_ma: 20

  # 出場
  # stop_mode 決定停損停利怎麼算:
  #   pct = 固定百分比，每檔一視同仁
  #   atr = N 倍 ATR，停損寬度自動跟著各股的波動度調整
  #
  # 為什麼會想換成 atr：固定 8% 對每檔都一樣，但一檔日常波動 1% 的電信股
  # 和一檔波動 5% 的航運股，8% 的意義完全不同——前者要跌很久才碰得到，
  # 後者兩天的正常震盪就把你掃出場了。
  # 想知道某檔的 ATR 有多大，看「研究」分頁，它會直接換算成百分比給你看。
  stop_mode: pct

  # stop_mode: pct 時用這兩個
  stop_loss_pct: 8.0       # 自進場成交價起算
  take_profit_pct: 15.0

  # stop_mode: atr 時用這三個。停損寬度在進場當下就固定，之後不會變動——
  # 會移動的停損線沒辦法讓你在進場前算出這筆最多會賠多少。
  atr_period: 14
  atr_stop_multiple: 2.0     # 停損 = 進場價 − 2 × ATR
  atr_target_multiple: 3.5   # 停利 = 進場價 + 3.5 × ATR（風報比 1:1.75）

  max_hold_bars: 15        # 抱滿 15 根 K 還沒觸發就走 —— 這條是「波段」的定義
  trailing_stop_pct: 0.0   # 設 >0 才啟用移動停損（例如 10.0）

# ------------------------------------------------------------
# 資料充足度保護
# ------------------------------------------------------------
# 資料還沒到齊就跑，得到的「今天沒有訊號」是假的——它只代表沒東西可看，
# 而系統會把那一天當成處理完畢記下來，之後補了歷史也回不去。
#
# 實際發生過：2026-08-20 早上執行時 data/history/ 幾乎是空的，
# 掃描池 40 檔沒幾檔有 61 根 K，所以「沒有訊號」；當天稍晚補齊歷史後重算，
# 2603 其實是成立的（突破前 20 日高點 242，收 246）——但那一天已經被鎖住了。
#
# 現在低於門檻就整段不算數：不成交、不寫 last_date、不記淨值，
# 補完資料重跑同一天會補回來。
data_guard:
  min_ready_codes: 10      # 至少要幾檔「資料足夠」才算數。設 0 = 關掉保護（不建議）

changelog:
  - date: "2026-08-20"
    note: "初版：1～2 週波段突破策略，模擬倉 100 萬、每檔 20%、最多 5 檔。"
  - date: "2026-08-21"
    note: "加入 data_guard：資料不足時整天不算數，避免空轉的那天被永久鎖住。策略參數未動。"
