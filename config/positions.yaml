# ============================================================
# 目前持股 —— 手動維護
# ============================================================
# 每次進場就在這裡加一筆，出場就把 exit_date / exit_price 填上。
#
# ⚠️ thesis（當初理由）是這整個檔案裡最重要的一欄。
#    兩個月後你要覆盤的不是股價，是你的判斷。
#    寫下「我為什麼買」和「什麼情況我會認錯」，一句話就好。
# ------------------------------------------------------------
# 欄位說明:
#   code       股票代號（字串，請加引號，避免 006208 被讀成數字 6208）
#   shares     股數（1 張 = 1000 股）
#   cost       每股成本（含手續費更準）
#   entry_date 進場日 YYYY-MM-DD
#   thesis     當初的買進理由
#   invalidate 什麼情況代表這個理由已經不成立（= 該認錯出場）
#   exit_date / exit_price  出場後填入，程式會自動略過已出場部位
# ------------------------------------------------------------

positions:
  - code: "006208"
    shares: 2000
    cost: 210.5
    entry_date: "2026-03-14"
    thesis: "核心持股，台灣大盤 beta，作為部位基底不主動擇時。"
    invalidate: "核心部位不設停損，僅在資產配置調整時處分。"
    # 核心 ETF 不想被停損訊號打擾，可以標記 core: true
    core: true

  - code: "2412"
    shares: 3000
    cost: 132.0
    entry_date: "2026-05-08"
    thesis: "現金流部位：電信股現金殖利率穩定，波動低。"
    invalidate: "配息政策轉差，或本業營收連兩季衰退。"

  - code: "2330"
    shares: 1000
    cost: 1980.0
    entry_date: "2026-06-20"
    thesis: "先進製程訂單能見度高，法人持續調升目標價。"
    invalidate: "先進製程稼動率下滑，或大客戶砍單。"

# ------------------------------------------------------------
# 觀察清單 —— 還沒買，但每天想看到報價
# ------------------------------------------------------------
watchlist:
  - code: "00919"
    note: "高股息 ETF，觀察配息穩定度與折溢價。"
  - code: "2603"
    note: "航運，波動大，只觀察不進場。"
