# ============================================================
# 目前持股 —— 手動維護
# ============================================================
# 每次進場就在這裡加一筆，出場就把 exit_date / exit_price 填上。
#
# ⚠️ thesis（當初理由）是這整個檔案裡最重要的一欄。
#    兩個月後你要覆盤的不是股價，是你的判斷。
#    寫下「我為什麼買」和「什麼情況我會認錯」，一句話就好。
# ------------------------------------------------------------
# 欄位說明:
#   code       股票代號（字串，請加引號，避免 006208 被讀成數字 6208）
#   shares     股數（1 張 = 1000 股）
#   cost       每股成本（含手續費更準）
#   entry_date 進場日 YYYY-MM-DD
#   thesis     當初的買進理由
#   invalidate 什麼情況代表這個理由已經不成立（= 該認錯出場）
#   exit_date / exit_price  出場後填入，程式會自動略過已出場部位
# ------------------------------------------------------------

# 還沒買任何股票的話，這裡留空就好（positions: []）。
# 「今日」頁會顯示「還沒有登記持股」，觀察清單仍然照常更新報價。
#
# 真的買進之後再登記——建議用儀表板的「持股異動 → 新增持股」填表，
# 不需要手動編輯這個檔案。下面註解掉的是格式範例。

positions: []

# 格式範例（把 # 拿掉並改成你自己的）：
#
#   - code: "2330"            # 記得加引號，避免 006208 被讀成數字 6208
#     shares: 1000            # 股數，1 張 = 1000 股
#     cost: 1980.0            # 每股成本（含手續費更準）
#     entry_date: "2026-06-20"
#     thesis: "先進製程訂單能見度高。"          # 為什麼買 ← 最重要的一欄
#     invalidate: "先進製程稼動率下滑或大客戶砍單。"   # 什麼情況代表我錯了
#
#   - code: "006208"
#     shares: 2000
#     cost: 210.5
#     entry_date: "2026-03-14"
#     thesis: "核心持股，台灣大盤 beta，不主動擇時。"
#     invalidate: "核心部位不設停損，僅在資產配置調整時處分。"
#     core: true              # 核心部位：不套用停損停利訊號

# ------------------------------------------------------------
# 觀察清單 —— 還沒買，但每天想看到報價
# ------------------------------------------------------------
# 這份清單同時也是**模擬倉每天掃描的標的池**（見 history.universe_from_config）。
#
# 為什麼是 40 檔而不是 10 檔：
#   模擬倉的四個進場條件很嚴，一年只會產生十幾筆交易——而回測程式自己會說
#   「至少要 30～50 筆才勉強看得出傾向」。掃 11 檔要等兩年才有 30 筆，
#   掃 40 檔大約半年就有。要更快拿到樣本就加標的，不要放寬進場條件：
#   放寬條件是換掉你正在測的東西，加標的不是。
#
# 選股原則（不是選「會漲的」，是選「能產生獨立訊號的」）：
#   1. 日均量要遠高於 paper.yaml 的 min_avg_volume（500 張），否則永遠不會觸發。
#   2. 跨產業分散。同時放三檔高股息 ETF 只會讓它們搶同一個部位額度，
#      不會增加有效樣本——高度相關的標的等於同一筆交易做三次。
#   3. 儘量挑 sectors.yaml 裡已經有產業背景的代號，「研究」頁才有東西可看。
watchlist:

  # ---- 大盤 / ETF ----
  - code: "0050"
    note: 市值型 ETF，當作大盤基準：模擬倉的總報酬要能贏它才有意義
  - code: "00919"
    note: "高股息 ETF，觀察配息穩定度與折溢價。"

  # ---- 半導體 ----
  - code: "2330"
    note: AI 供應鏈：晶圓代工＋CoWoS 先進封裝
  - code: "2303"
    note: 晶圓代工：成熟製程，與 2330 的循環位置不同
  - code: "2454"
    note: AI 供應鏈：IC 設計，切入 Google TPU
  - code: "3034"
    note: IC 設計：驅動 IC 與 SoC
  - code: "2379"
    note: IC 設計：網通與高速傳輸介面
  - code: "3443"
    note: IC 設計服務：ASIC / IP，跟著客戶的自研晶片走
  - code: "3661"
    note: IC 設計服務：ASIC，客戶集中度高
  - code: "3711"
    note: AI 供應鏈：CoWoS 後段封裝測試
  - code: "2408"
    note: 記憶體：DRAM，報價循環股，沒有訂價權
  - code: "2344"
    note: 記憶體：利基型 DRAM 與 Flash

  # ---- PCB / 載板 ----
  - code: "3037"
    note: AI 供應鏈：ABF 載板
  - code: "8046"
    note: AI 供應鏈：ABF 載板
  - code: "2313"
    note: AI 供應鏈：AI 伺服器高階 PCB，另有衛星題材
  - code: "2368"
    note: PCB：伺服器與網通高層數板
  - code: "6213"
    note: PCB 上游：銅箔基板（CCL），看高階材料佔比

  # ---- 伺服器 / 代工 / 網通 ----
  - code: "2317"
    note: 電子代工龍頭：營收大但毛利薄，營收成長不等於獲利成長
  - code: "2382"
    note: 代工：AI 伺服器＋筆電
  - code: "3231"
    note: 代工：伺服器與筆電
  - code: "6669"
    note: 雲端伺服器：客戶極度集中，跟著雲端業者資本支出走
  - code: "2345"
    note: 網通：資料中心高速交換器
  - code: "2376"
    note: 板卡與 AI 伺服器
  - code: "2357"
    note: 品牌 PC，兼有 AI 伺服器業務

  # ---- 零組件 / 散熱 / 光學 ----
  - code: "2308"
    note: AI 供應鏈：伺服器電源模組＋散熱
  - code: "3324"
    note: AI 供應鏈：液冷散熱
  - code: "3017"
    note: AI 供應鏈：風冷散熱模組
  - code: "3008"
    note: 光學鏡頭，單價高、股性獨立於 AI 題材

  # ---- 航運 / 航空 ----
  - code: "2603"
    note: "航運，波動大，只觀察不進場。"
  - code: "2609"
    note: 航運：貨櫃，與 2603 高度連動，留著看訊號一致性
  - code: "2618"
    note: 航空：客貨運，驅動因子與貨櫃航運不同

  # ---- 原物料 / 傳產 ----
  - code: "2002"
    note: 鋼鐵：鋼價與內外銷需求
  - code: "1301"
    note: 塑化：油價與中國需求
  - code: "1605"
    note: 電線電纜／銅，跟著銅價與電網建設

  # ---- 金融 ----
  - code: "2891"
    note: 金控：銀行為主，兼壽險
  - code: "2881"
    note: 金控：壽險比重高，淨值對股債市敏感

  # ---- 民生內需 / 電信 ----
  - code: "1216"
    note: 食品：需求穩定，低波動對照組
  - code: "2912"
    note: 零售通路：同店營收與高毛利商品佔比
  - code: "2412"
    note: 電信：幾乎沒有循環，現金流型標的
  - code: "4904"
    note: 電信：同 2412，資費升級與企業服務
