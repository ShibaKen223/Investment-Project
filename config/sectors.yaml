    position: 組裝端，客戶是雲端服務業者與品牌廠。
    revenue_driver: AI 伺服器與筆電的出貨量。AI 伺服器單價高但毛利率不一定高。
    watch: [AI 伺服器出貨與佔比, 毛利率, 雲端業者的資本支出]
    terms: [odm, ai_server, gross_margin]

  "3231":
