# ============================================================
# 產業地圖 —— 這家公司在供應鏈的哪個位置、該追蹤什麼
# ============================================================
# ⚠️ 這份檔案是**人工整理的靜態知識，會過時**。
#
# 這裡刻意只寫「商業模式」和「該看什麼指標」這類變化很慢的東西，
# 不寫市占率、客戶名單、目標價、財測——那些寫下來三個月就過期，
# 而過期的資料比沒有資料更危險，因為你會以為它還準。
#
# 找不到的代號不會出錯，研究報告會照樣產生，只是少了產業背景那一段。
# 你買了新標的就自己往下加一筆，或請 AI 幫你補。
#
# 欄位:
#   name           公司/ETF 名稱
#   sector         產業分類
#   what           它到底在賣什麼（白話，一兩句）
#   position       在供應鏈的哪一段
#   revenue_driver 營收主要跟著什麼跑 ← 這欄最重要
#   watch          該追蹤的指標／事件
#   terms          相關名詞（對應 glossary.yaml 的代號）
# ------------------------------------------------------------

stocks:

  # ==========================================================
  # ETF
  # ==========================================================

  "0050":
    name: 元大台灣50
    sector: ETF - 市值型
    what: 買進台股市值最大的 50 家公司，一檔就等於買了台股的主體。
    position: 被動追蹤指數，不主動選股。
    revenue_driver: 就是台股大盤本身，其中半導體權重極高，所以它跟台積電連動非常強。
    watch: [大盤指數, 成分股調整, 內扣費用, 折溢價]
    terms: [etf, etf_premium]

  "006208":
    name: 富邦台50
    sector: ETF - 市值型
    what: 追蹤和 0050 同一個指數，內容幾乎一樣，差別在發行商和費用。
    position: 被動追蹤指數。
    revenue_driver: 台股大盤，半導體權重高。
    watch: [大盤指數, 內扣費用與 0050 的差異, 折溢價]
    terms: [etf, etf_premium]

  "0056":
    name: 元大高股息
    sector: ETF - 高股息
    what: 挑「預期配息率高」的股票組成，主打現金流而非價格成長。
    position: 被動追蹤指數，但選股規則會篩掉不配息的成長股。
    revenue_driver: >-
      成分股的配息能力。因為篩選條件排除了很多不配息的成長型公司，
      長期總報酬不一定會贏市值型 ETF——它換來的是比較穩定的現金流。
    watch: [配息金額與頻率, 是否填息, 成分股汰換, 折溢價]
    terms: [etf, dividend_yield, ex_dividend, etf_premium]

  "00878":
    name: 國泰永續高股息
    sector: ETF - 高股息
    what: 高股息 ETF，季配息，成分股偏向金融與電子權值股。
    position: 被動追蹤指數。
    revenue_driver: 成分股配息能力。
    watch: [季配息金額, 是否填息, 收益平準金使用情況, 折溢價]
    terms: [etf, dividend_yield, ex_dividend, etf_premium]

  "00919":
    name: 群益台灣精選高息
    sector: ETF - 高股息
    what: 高股息 ETF，選股時會參考已公告的股利資訊，季配息。
    position: 被動追蹤指數。
    revenue_driver: >-
      成分股配息能力。這類 ETF 在市場熱度高時容易出現明顯溢價，
      買在溢價高點等於先虧一段。
    watch: [季配息金額, 是否填息, 折溢價, 成分股汰換, 規模變化]
    terms: [etf, dividend_yield, ex_dividend, etf_premium]

  # ==========================================================
  # 半導體
  # ==========================================================

  "2330":
    name: 台積電
    sector: 半導體 - 晶圓代工
    what: 替全世界的 IC 設計公司製造晶片，自己不設計、不賣終端產品。
    position: >-
      供應鏈的製造核心。上游是設備與材料商，下游是 IC 設計公司，
      再下游才是手機、伺服器、車廠等終端品牌。
    revenue_driver: >-
      客戶的訂單量，尤其是先進製程的訂單。先進製程單價與毛利遠高於成熟製程，
      所以「先進製程佔營收比重」比總營收更能說明獲利品質。
    watch:
      - 每月營收年增率
      - 法說會給的下季展望與全年資本支出
      - 先進製程佔營收比重
      - 產能利用率、毛利率
      - 主要終端市場（手機、AI、車用）的需求變化
    terms: [foundry, process_node, wafer, yield, utilization, gross_margin, earnings_call, advanced_packaging, cowos]

  "2454":
    name: 聯發科
    sector: 半導體 - IC 設計
    what: 設計手機和各類裝置用的系統單晶片，製造外包給晶圓代工廠。
    position: IC 設計，上游是晶圓代工與封測，下游是手機與消費電子品牌。
    revenue_driver: 手機出貨量與規格升級，以及能否切入更高階的產品線。
    watch: [手機市場需求, 新產品規格與採用進度, 毛利率, 庫存水位]
    terms: [fabless, process_node, gross_margin, earnings_call]

  "3711":
    name: 日月光投控
    sector: 半導體 - 封裝測試
    what: 專門做晶片的封裝和測試，是全球規模最大的封測服務業者之一。
    position: 半導體後段製程。晶圓廠做完晶片後交給它封裝測試。
    revenue_driver: >-
      整體半導體出貨量，以及先進封裝的滲透率。
      先進封裝的單價和毛利遠高於傳統封裝，產品組合是關鍵。
    watch: [產能利用率, 先進封裝佔比, 資本支出方向, 半導體整體景氣]
    terms: [packaging, advanced_packaging, utilization, gross_margin]

  "2408":
    name: 南亞科
    sector: 半導體 - 記憶體
    what: 生產 DRAM 記憶體。
    position: IDM，自己設計也自己製造。
    revenue_driver: >-
      DRAM 現貨與合約報價。這是標準化商品，價格由供需決定，
      公司幾乎沒有訂價權，所以獲利波動極大。
    watch: [DRAM 報價走勢, 供應商的擴產與減產, 庫存週期]
    terms: [dram, idm, gross_margin]

  # ==========================================================
  # PCB / 載板
  # ==========================================================

  "3037":
    name: 欣興
    sector: PCB - IC 載板
    what: 生產 IC 載板與各類印刷電路板，其中 ABF 載板用於高階運算晶片。
    position: >-
      介於晶片和主機板之間的關鍵零件。它的客戶是晶片廠與封測廠，
      再往下才是伺服器與電腦品牌。
    revenue_driver: >-
      高階運算晶片（CPU、GPU、AI 加速器）的出貨量。ABF 載板層數多、
      面積大、良率難拉、擴產要好幾年，供給彈性很低——
      這是它在需求爆發時特別敏感的原因。
    watch: [ABF 載板產能利用率與擴產進度, 高階與低階產品組合, 毛利率, AI 伺服器出貨動能]
    terms: [substrate, pcb, advanced_packaging, utilization, gross_margin]

  "8046":
    name: 南電
    sector: PCB - IC 載板
    what: 生產 IC 載板，產品線同樣涵蓋 ABF 與 BT 載板。
    position: 同欣興，屬於晶片與電路板之間的載板供應商。
    revenue_driver: 高階運算晶片出貨量，以及 ABF 產能的供需狀況。
    watch: [ABF 產能利用率, 產品組合, 毛利率, 客戶的擴產計畫]
    terms: [substrate, pcb, utilization, gross_margin]

  "2368":
    name: 金像電
    sector: PCB - 高階板
    what: 生產印刷電路板，產品涵蓋伺服器與網通用的高層數板。
    position: PCB 製造，客戶是伺服器與網通設備的組裝廠。
    revenue_driver: >-
      伺服器（尤其 AI 伺服器）的出貨量與規格。高階伺服器用的板子層數多、
      材料要求高，單價遠高於一般 PCB——所以「出貨結構」比「出貨量」重要。
    watch: [伺服器板佔營收比重, 高階板產能, 毛利率, 客戶端的建置進度]
    terms: [pcb, ccl, ai_server, gross_margin]

  "6213":
    name: 聯茂
    sector: PCB - 上游材料
    what: 生產銅箔基板（CCL），是製造 PCB 的原料。
    position: PCB 的上游材料供應商。
    revenue_driver: >-
      PCB 產業的整體需求，以及高頻高速材料的滲透率。
      AI 與高速傳輸帶動的是「高階 CCL」，不是所有等級都同樣受惠。
    watch: [高階材料佔比, 銅價等原料成本, 下游 PCB 廠的稼動率]
    terms: [ccl, pcb, gross_margin]

  # ==========================================================
  # AI 伺服器與電子代工
  # ==========================================================

  "2317":
    name: 鴻海
    sector: 電子代工 - ODM/EMS
    what: 大規模代工組裝各類電子產品，近年積極擴展伺服器與電動車。
    position: 供應鏈最下游的組裝端，直接面對品牌客戶。
    revenue_driver: >-
