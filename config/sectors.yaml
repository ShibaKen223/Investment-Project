# ============================================================
# 產業地圖 —— 這家公司在供應鏈的哪個位置、該追蹤什麼
# ============================================================
# ⚠️ 這份檔案是**人工整理的靜態知識，會過時**。
#
# 這裡刻意只寫「商業模式」和「該看什麼指標」這類變化很慢的東西，
# 不寫市占率、客戶名單、目標價、財測——那些寫下來三個月就過期，
# 而過期的資料比沒有資料更危險，因為你會以為它還準。
#
# 找不到的代號不會出錯，研究報告會照樣產生，只是少了產業背景那一段。
# 你買了新標的就自己往下加一筆，或請 AI 幫你補。
#
# 欄位:
#   name           公司/ETF 名稱
#   sector         產業分類
#   what           它到底在賣什麼（白話，一兩句）
#   position       在供應鏈的哪一段
#   revenue_driver 營收主要跟著什麼跑 ← 這欄最重要
#   watch          該追蹤的指標／事件
#   terms          相關名詞（對應 glossary.yaml 的代號）
# ------------------------------------------------------------

stocks:

  # ==========================================================
  # ETF
  # ==========================================================

  "0050":
    name: 元大台灣50
    sector: ETF - 市值型
    what: 買進台股市值最大的 50 家公司，一檔就等於買了台股的主體。
    position: 被動追蹤指數，不主動選股。
    revenue_driver: 就是台股大盤本身，其中半導體權重極高，所以它跟台積電連動非常強。
    watch: [大盤指數, 成分股調整, 內扣費用, 折溢價]
    terms: [etf, etf_premium]

  "006208":
    name: 富邦台50
    sector: ETF - 市值型
    what: 追蹤和 0050 同一個指數，內容幾乎一樣，差別在發行商和費用。
    position: 被動追蹤指數。
    revenue_driver: 台股大盤，半導體權重高。
    watch: [大盤指數, 內扣費用與 0050 的差異, 折溢價]
    terms: [etf, etf_premium]

  "0056":
    name: 元大高股息
    sector: ETF - 高股息
    what: 挑「預期配息率高」的股票組成，主打現金流而非價格成長。
    position: 被動追蹤指數，但選股規則會篩掉不配息的成長股。
    revenue_driver: >-
      成分股的配息能力。因為篩選條件排除了很多不配息的成長型公司，
      長期總報酬不一定會贏市值型 ETF——它換來的是比較穩定的現金流。
    watch: [配息金額與頻率, 是否填息, 成分股汰換, 折溢價]
    terms: [etf, dividend_yield, ex_dividend, etf_premium]

  "00878":
    name: 國泰永續高股息
    sector: ETF - 高股息
    what: 高股息 ETF，季配息，成分股偏向金融與電子權值股。
    position: 被動追蹤指數。
    revenue_driver: 成分股配息能力。
    watch: [季配息金額, 是否填息, 收益平準金使用情況, 折溢價]
    terms: [etf, dividend_yield, ex_dividend, etf_premium]

  "00919":
    name: 群益台灣精選高息
    sector: ETF - 高股息
    what: 高股息 ETF，選股時會參考已公告的股利資訊，季配息。
    position: 被動追蹤指數。
    revenue_driver: >-
      成分股配息能力。這類 ETF 在市場熱度高時容易出現明顯溢價，
      買在溢價高點等於先虧一段。
    watch: [季配息金額, 是否填息, 折溢價, 成分股汰換, 規模變化]
    terms: [etf, dividend_yield, ex_dividend, etf_premium]

  # ==========================================================
  # 半導體
  # ==========================================================

  "2330":
    name: 台積電
    sector: 半導體 - 晶圓代工
    what: 替全世界的 IC 設計公司製造晶片，自己不設計、不賣終端產品。
    position: >-
      供應鏈的製造核心。上游是設備與材料商，下游是 IC 設計公司，
      再下游才是手機、伺服器、車廠等終端品牌。
    revenue_driver: >-
      客戶的訂單量，尤其是先進製程的訂單。先進製程單價與毛利遠高於成熟製程，
      所以「先進製程佔營收比重」比總營收更能說明獲利品質。
    watch:
      - 每月營收年增率
      - 法說會給的下季展望與全年資本支出
      - 先進製程佔營收比重
      - 產能利用率、毛利率
      - 主要終端市場（手機、AI、車用）的需求變化
    terms: [foundry, process_node, wafer, yield, utilization, gross_margin, earnings_call, advanced_packaging, cowos]

  "2454":
    name: 聯發科
    sector: 半導體 - IC 設計
    what: 設計手機和各類裝置用的系統單晶片，製造外包給晶圓代工廠。
    position: IC 設計，上游是晶圓代工與封測，下游是手機與消費電子品牌。
    revenue_driver: 手機出貨量與規格升級，以及能否切入更高階的產品線。
    watch: [手機市場需求, 新產品規格與採用進度, 毛利率, 庫存水位]
    terms: [fabless, process_node, gross_margin, earnings_call]

  "3711":
    name: 日月光投控
    sector: 半導體 - 封裝測試
    what: 專門做晶片的封裝和測試，是全球規模最大的封測服務業者之一。
    position: 半導體後段製程。晶圓廠做完晶片後交給它封裝測試。
    revenue_driver: >-
      整體半導體出貨量，以及先進封裝的滲透率。
      先進封裝的單價和毛利遠高於傳統封裝，產品組合是關鍵。
    watch: [產能利用率, 先進封裝佔比, 資本支出方向, 半導體整體景氣]
    terms: [packaging, advanced_packaging, utilization, gross_margin]

  "2408":
    name: 南亞科
    sector: 半導體 - 記憶體
    what: 生產 DRAM 記憶體。
    position: IDM，自己設計也自己製造。
    revenue_driver: >-
      DRAM 現貨與合約報價。這是標準化商品，價格由供需決定，
      公司幾乎沒有訂價權，所以獲利波動極大。
    watch: [DRAM 報價走勢, 供應商的擴產與減產, 庫存週期]
    terms: [dram, idm, gross_margin]

  "2344":
    name: 華邦電
    sector: 半導體 - 記憶體
    what: 生產利基型 DRAM 與 NOR Flash 記憶體，並有自己的晶圓廠。
    position: IDM，自己設計也自己製造。
    revenue_driver: >-
      記憶體報價與消費性、車用、工控等利基市場的需求。
      利基型記憶體的價格波動通常小於標準型 DRAM，但方向仍跟著大循環走。
    watch: [記憶體報價, 產能利用率, 客戶端庫存, 新廠折舊壓力]
    terms: [dram, nand, idm, utilization, gross_margin]

  "2303":
    name: 聯電
    sector: 半導體 - 晶圓代工
    what: 晶圓代工廠，以成熟製程與特殊製程為主，不追最先進的節點。
    position: 與 2330 同一段供應鏈，但產品組合完全不同。
    revenue_driver: >-
      成熟製程的產能利用率與報價。成熟製程競爭者多、進入障礙低於先進製程，
      所以它對「產能過剩」比先進製程敏感得多——這也是它和台積電
      不會同步的原因，放在同一份清單裡才有分散的意義。
    watch: [產能利用率, 成熟製程報價, 同業擴產進度, 毛利率]
    terms: [foundry, process_node, wafer, utilization, gross_margin]

  "3034":
    name: 聯詠
    sector: 半導體 - IC 設計
    what: 設計顯示驅動 IC 與系統單晶片，用在面板、電視、手機螢幕等。
    position: IC 設計，製造外包，下游是面板廠與品牌廠。
    revenue_driver: 面板與消費電子的出貨量，以及高階顯示規格的滲透率。
    watch: [面板廠稼動率, 消費電子需求, 庫存水位, 毛利率]
    terms: [fabless, gross_margin, earnings_call]

  "2379":
    name: 瑞昱
    sector: 半導體 - IC 設計
    what: 設計網通、乙太網路、音效與各類週邊介面晶片。
    position: IC 設計，客戶涵蓋 PC、網通設備與消費電子。
    revenue_driver: PC 與網通設備出貨量，以及高速傳輸規格的世代更替。
    watch: [PC 與網通需求, 新規格導入進度, 庫存水位, 毛利率]
    terms: [fabless, gross_margin]

  "3443":
    name: 創意
    sector: 半導體 - IC 設計服務
    what: 提供 ASIC 設計服務與矽智財，幫客戶把規格做成可量產的客製晶片。
    position: >-
      介於 IC 設計與晶圓代工之間。客戶自己不見得有完整設計能力，
      由它承接設計、投片、封測，再交回成品晶片。
    revenue_driver: >-
      客戶自研晶片的專案數與量產時程。營收分成 NRE（設計服務費）
      與量產出貨兩塊，兩者的毛利結構差很多——只看總營收會誤判。
    watch: [新專案取得, 量產與 NRE 佔比, 先進製程投片進度, 毛利率]
    terms: [fabless, foundry, process_node, gross_margin]

  "3661":
    name: 世芯-KY
    sector: 半導體 - IC 設計服務
    what: ASIC 設計服務，專注高效能運算的客製晶片。
    position: 同創意，屬設計服務端。
    revenue_driver: >-
      少數大型客戶的客製晶片專案。客戶集中度極高是它的結構特徵——
      單一專案的遞延或取消會直接反映在營收上，波動比一般 IC 設計大。
    watch: [客戶集中度, 專案量產時程, 先進製程佔比, 毛利率]
    terms: [fabless, foundry, process_node, gross_margin]

  # ==========================================================
  # PCB / 載板
  # ==========================================================

  "3037":
    name: 欣興
    sector: PCB - IC 載板
    what: 生產 IC 載板與各類印刷電路板，其中 ABF 載板用於高階運算晶片。
    position: >-
      介於晶片和主機板之間的關鍵零件。它的客戶是晶片廠與封測廠，
      再往下才是伺服器與電腦品牌。
    revenue_driver: >-
      高階運算晶片（CPU、GPU、AI 加速器）的出貨量。ABF 載板層數多、
      面積大、良率難拉、擴產要好幾年，供給彈性很低——
      這是它在需求爆發時特別敏感的原因。
    watch: [ABF 載板產能利用率與擴產進度, 高階與低階產品組合, 毛利率, AI 伺服器出貨動能]
    terms: [substrate, pcb, advanced_packaging, utilization, gross_margin]

  "8046":
    name: 南電
    sector: PCB - IC 載板
    what: 生產 IC 載板，產品線同樣涵蓋 ABF 與 BT 載板。
    position: 同欣興，屬於晶片與電路板之間的載板供應商。
    revenue_driver: 高階運算晶片出貨量，以及 ABF 產能的供需狀況。
    watch: [ABF 產能利用率, 產品組合, 毛利率, 客戶的擴產計畫]
    terms: [substrate, pcb, utilization, gross_margin]

  "2368":
    name: 金像電
    sector: PCB - 高階板
    what: 生產印刷電路板，產品涵蓋伺服器與網通用的高層數板。
    position: PCB 製造，客戶是伺服器與網通設備的組裝廠。
    revenue_driver: >-
      伺服器（尤其 AI 伺服器）的出貨量與規格。高階伺服器用的板子層數多、
      材料要求高，單價遠高於一般 PCB——所以「出貨結構」比「出貨量」重要。
    watch: [伺服器板佔營收比重, 高階板產能, 毛利率, 客戶端的建置進度]
    terms: [pcb, ccl, ai_server, gross_margin]

  "6213":
    name: 聯茂
    sector: PCB - 上游材料
    what: 生產銅箔基板（CCL），是製造 PCB 的原料。
    position: PCB 的上游材料供應商。
    revenue_driver: >-
      PCB 產業的整體需求，以及高頻高速材料的滲透率。
      AI 與高速傳輸帶動的是「高階 CCL」，不是所有等級都同樣受惠。
    watch: [高階材料佔比, 銅價等原料成本, 下游 PCB 廠的稼動率]
    terms: [ccl, pcb, gross_margin]

  "2313":
    name: 華通
    sector: PCB - 手機板/HDI
    what: 生產印刷電路板，以手機用的 HDI 板為主，並跨入伺服器與衛星通訊用板。
    position: PCB 製造，客戶是手機品牌與各類設備組裝廠。
    revenue_driver: >-
      手機出貨量與規格（層數、材料），加上新切入的伺服器與衛星應用比重。
      手機是成熟市場，成長要看的是「非手機營收佔比」爬得多快。
    watch: [手機出貨與規格, 非手機營收佔比, 稼動率, 毛利率]
    terms: [pcb, hdi, ai_server, utilization, gross_margin]

  # ==========================================================
  # AI 伺服器與電子代工
  # ==========================================================

  "2317":
    name: 鴻海
    sector: 電子代工 - ODM/EMS
    what: 大規模代工組裝各類電子產品，近年積極擴展伺服器與電動車。
    position: 供應鏈最下游的組裝端，直接面對品牌客戶。
    revenue_driver: >-
      客戶的終端出貨量。營收規模極大但毛利率薄，
      所以「營收成長」和「獲利成長」經常不同步——這點要特別注意。
    watch: [各業務別佔比變化, 毛利率, 伺服器業務進展, 客戶集中度]
    terms: [odm, ai_server, gross_margin, operating_margin]

  "2382":
    name: 廣達
    sector: 電子代工 - 伺服器/筆電
    what: 代工筆電與伺服器，近年 AI 伺服器成為重要成長來源。
    position: 組裝端，客戶是雲端服務業者與品牌廠。
    revenue_driver: AI 伺服器與筆電的出貨量。AI 伺服器單價高但毛利率不一定高。
    watch: [AI 伺服器出貨與佔比, 毛利率, 雲端業者的資本支出]
    terms: [odm, ai_server, gross_margin]

  "3231":
    name: 緯創
    sector: 電子代工 - 伺服器/筆電
    what: 代工筆電、伺服器與相關產品。
    position: 組裝端。
    revenue_driver: 伺服器與筆電出貨量，AI 相關產品的比重變化。
    watch: [AI 相關營收佔比, 毛利率, 產能布局]
    terms: [odm, ai_server, gross_margin]

  "6669":
    name: 緯穎
    sector: 電子代工 - 雲端伺服器
    what: 專做雲端資料中心的伺服器，客戶集中在少數大型雲端業者。
    position: 組裝端，但客戶結構跟一般 ODM 不同，直接服務雲端業者。
    revenue_driver: >-
      大型雲端業者的資本支出週期。客戶高度集中是它的特色，
      也是它的風險——單一客戶的建置節奏會直接放大到營收上。
    watch: [雲端業者資本支出, 客戶集中度, 毛利率, AI 機櫃出貨]
    terms: [odm, ai_server, liquid_cooling, gross_margin]

  "2308":
    name: 台達電
    sector: 電子零組件 - 電源/散熱
    what: 生產電源供應器、散熱與電力管理相關產品，也做工業自動化與電動車零件。
    position: 零組件供應商，AI 伺服器的電源與散熱是重要成長來源。
    revenue_driver: >-
      伺服器建置量（電源與散熱需求隨耗電量上升而增加）、
      電動車與工業自動化的需求。
    watch: [各業務別佔比, AI 相關產品進度, 毛利率, 電動車業務發展]
    terms: [ai_server, liquid_cooling, gross_margin, operating_margin]

  "2345":
    name: 智邦
    sector: 網通 - 資料中心交換器
    what: 設計製造網路交換器，主力是資料中心用的高速交換器。
    position: >-
      網通設備 ODM。伺服器要串成叢集才能運作，交換器就是把它們連起來的東西，
      所以它的需求跟著資料中心建置量走，而不是跟著伺服器單價走。
    revenue_driver: 資料中心的建置量與網路速率世代（越高速的交換器單價越高）。
    watch: [高速交換器出貨與速率組合, 雲端業者資本支出, 毛利率]
    terms: [ai_server, odm, optical_module, gross_margin]

  "2376":
    name: 技嘉
    sector: 電子零組件 - 板卡/伺服器
    what: 生產主機板與顯示卡，並跨足 AI 伺服器整機。
    position: 板卡製造與品牌兼具，近年伺服器業務比重上升。
    revenue_driver: >-
      PC 與顯示卡的消費需求，加上 AI 伺服器出貨。
      這兩塊的毛利結構不同，營收成長不一定帶動獲利同幅成長。
    watch: [伺服器營收佔比, 顯示卡需求與庫存, 毛利率]
    terms: [ai_server, gross_margin, operating_margin]

  "2357":
    name: 華碩
    sector: 品牌 - PC/伺服器
    what: 自有品牌的筆電、桌機與周邊，並經營伺服器與零組件業務。
    position: 品牌端，直接面對消費者與企業客戶。
    revenue_driver: PC 換機週期與消費需求，加上 AI 伺服器等新業務的進展。
    watch: [PC 出貨與庫存, 品牌與代工業務佔比, 毛利率, 匯率]
    terms: [ai_server, gross_margin, operating_margin]

  "3324":
    name: 雙鴻
    sector: 電子零組件 - 散熱
    what: 生產散熱模組，產品涵蓋傳統風冷與資料中心用的液冷方案。
    position: 零組件供應商，客戶是伺服器與電子產品的組裝廠。
