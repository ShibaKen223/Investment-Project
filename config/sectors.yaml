    watch: [同店營收成長, 店數變化, 毛利率, 轉投資獲利]
    terms: [gross_margin, dividend_yield]

# ------------------------------------------------------------
# 產業層級的共通提醒
# ------------------------------------------------------------
sector_notes:

  "半導體":
    cycle: 景氣循環明顯，且循環週期長（產能是提前 2-3 年決定的）。
    trap: >-
      看到「營收創新高」不代表可以買。半導體的股價通常領先基本面反轉，
      獲利最漂亮的時候常常已經是循環後段。

  "PCB":
    cycle: 跟著下游電子業的產品週期走，季節性明顯。
    trap: >-
      「PCB 類股」內部差異極大，從幾塊錢的簡單板到上萬元的載板都算 PCB。
      看到「PCB 漲」先問：漲的是哪一種板？做低階板的公司不會因為
      AI 伺服器需求好就受惠。

  "ETF - 高股息":
    cycle: 配息通常季配或年配，除息前後價格有規律性波動。
    trap: >-
      高配息不等於高報酬。配息當天股價會直接扣掉配息金額，
      能不能「填息」才是重點。另外要留意買進時的折溢價。

  "航運":
    cycle: 極端的景氣循環股，運價可以在一兩年內漲十倍再跌回來。
    trap: >-
      本益比最低的時候通常最危險。運價高檔時獲利暴衝、本益比看起來只有
      兩三倍，但市場已經在預期運價要跌了。用成長股的邏輯看航運會吃大虧。

  "金融":
    cycle: 跟利率環境與資本市場表現連動。
    trap: 壽險為主的金控，淨值會隨股債市大幅波動，配息穩定度不一定如想像中高。

  "電信":
    cycle: 幾乎沒有循環，營收極穩定。
    trap: >-
      穩定的代價是成長性低。它適合當現金流部位，
      但如果你期待它跟著大盤一起漲，通常會失望。
