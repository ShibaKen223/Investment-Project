    what: 生產電源供應器、散熱與電力管理相關產品，也做工業自動化與電動車零件。
    position: 零組件供應商，AI 伺服器的電源與散熱是重要成長來源。
    revenue_driver: >-
      伺服器建置量（電源與散熱需求隨耗電量上升而增加）、
      電動車與工業自動化的需求。
    watch: [各業務別佔比, AI 相關產品進度, 毛利率, 電動車業務發展]
    terms: [ai_server, liquid_cooling, gross_margin, operating_margin]

  # ==========================================================
