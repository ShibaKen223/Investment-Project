    position: 組裝端。
    revenue_driver: 伺服器與筆電出貨量，AI 相關產品的比重變化。
    watch: [AI 相關營收佔比, 毛利率, 產能布局]
    terms: [odm, ai_server, gross_margin]

  "6669":
    name: 緯穎
    sector: 電子代工 - 雲端伺服器
    what: 專做雲端資料中心的伺服器，客戶集中在少數大型雲端業者。
    position: 組裝端，但客戶結構跟一般 ODM 不同，直接服務雲端業者。
    revenue_driver: >-
