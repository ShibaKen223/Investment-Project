# ============================================================
# 交易規則 —— 這份檔案就是「寫死在系統裡的紀律」
# ============================================================
# 改這裡的數字 = 改變你的交易規則。
# 每次修改請在 changelog 留一行，兩個月後覆盤時你會需要它。
# ------------------------------------------------------------

# 你在最佳化什麼？寫成一句可量測的話。
# 這行不影響程式運作，但每天都會印在報告最上面，提醒你自己。
objective: >-
  現階段目標是累積樣本，不是報酬：2027-02 前累積 ≥ 10 筆模擬倉完成交易，
  期間不修改任何策略參數。滿 30 筆「且分布於 ≥ 15 檔標的」後才評估，
  門檻為勝率 ≥ 50%、獲利因子 ≥ 1.5，
  回撤要同時滿足「絕對上限 ≤ 20%」與「優於同曝險的 0050」
  （＝ 0050 同期回撤 × 策略平均曝險；絕對數字是我的風險忍受度，
  相對那條才是公平比較——半倉策略的回撤天生就小，
  只看絕對數字在低曝險下等於自動過關），
  且「報酬 / 最大回撤」需勝過 0050 同期（不是比總報酬——曝險差太多，
  拿它比 100% 曝險的指數，在多頭裡結構上就贏不了）。
  認錯條件：30 筆後勝率 < 45%（賠率 1.22 的損益兩平點）或回撤 > 20% → 停用重審。

# ------------------------------------------------------------
# 你是怎麼交易的？
# ------------------------------------------------------------
#   manual  人工選股。日報會問你「當初的買進理由現在還成立嗎」，
#           停損停利訊號的意思是「你該考慮出場了」。
#           持股用儀表板的「持股異動」手動登記。
#
#   auto    程式交易。程式自己會進出場，所以日報改成**對帳**：
#           「規則說這檔早該出場了，但它還在持股清單裡——為什麼？」
#           持股改由 data/fills.csv 同步（python3 src/fills.py --sync），
#           不要再手動維護。
#
# 全自動交易最常見的壞法不是策略失效，是程式安靜地壞掉：
# API 斷線、委託被退、部位卡住。那些在券商 App 上看不出來，
# 只有每天對帳會浮出來——這就是 auto 模式下監控層的用途。
mode: manual

rules:
  # 停損 / 停利閾值（百分比）
  stop_loss_pct: 10.0      # 跌破成本 10% → 觸發停損訊號
  take_profit_pct: 22.0    # 漲超成本 22% → 觸發停利訊號

  # 停損基準:
  #   cost     = 以成本價計算（傳統固定停損）
  #   trailing = 以「進場後最高價」計算（移動停損，會隨獲利往上調）
  # trailing 需要歷史高點，資料來自 data/signals.jsonl，
  # 剛開始跑的前幾天會退化成 max(成本, 現價)，累積越久越準確。
  stop_basis: cost

  # 「接近」的定義：距離閾值幾個百分點以內就先預警
  near_threshold_pct: 3.0

# ------------------------------------------------------------
# 個股例外規則（可選）
# 高波動個股用同一組固定 % 容易被雜訊掃出場，可以在這裡單獨放寬。
# 未列出的個股一律套用上面的 rules。
# ------------------------------------------------------------
overrides:
  # "2330":
  #   stop_loss_pct: 15.0
  #   take_profit_pct: 30.0

# ------------------------------------------------------------
# 關於 ATR 停損
# ------------------------------------------------------------
# ATR（以 N 倍平均真實區間取代固定百分比，讓停損寬度隨個股波動度調整）
# 已經實作好了，但目前**只有模擬倉在用**——它的參數在模擬倉自己的設定裡，
# 跟這份檔案是兩套獨立的參數，改這裡不會影響模擬倉，反之亦然。
#
# 上面 rules 這一套是給「你的真實持股」用的，目前只支援
# stop_basis: cost（固定百分比）與 trailing（移動停損）兩種。
# 想讓真實持股也改用 ATR 的話，先看模擬倉跑幾個月的結果再決定——
# 順序不要反過來。

changelog:
  - date: "2026-07-29"
    note: "初版建立：10% 停損 / 22% 停利，以成本價為基準。"
  - date: "2026-09-01"
    note: >-
      只改評估門檻，沒有動任何交易參數（停損停利、進出場規則全部不變）。
      原本的「總報酬需勝過 0050 買進持有」是拿平均曝險 47% 的策略去比
      100% 曝險的指數，多頭裡結構上贏不了：實測 65.51% vs 149.86%，
      但最大回撤是 −9.34% vs −27.48%，報酬/回撤 7.01 贏過基準的 5.45。
      照舊門檻會把一個正在做好回撤控制的系統判成失敗，
      然後逼自己去調參數追一個追不到的數字。改成比風險調整後的報酬。
      另外把樣本條件加上「分布於 ≥ 15 檔」：108 筆交易只落在 22 檔上，
      同一檔在同一段趨勢裡反覆進出是序列相關的，只數筆數會高估樣本。
  - date: "2026-09-02"
    note: >-
      回撤門檻 15% → 「絕對 ≤ 20% 且優於同曝險 0050」。交易參數依然一個都沒動。

      先講清楚這是什麼：**這是一次在門檻失敗之後才改門檻的修改**，
      預設就該被當成搬門柱看待。以下是它為什麼不是。

      起因是 paper.yaml 開放零股（trade_unit: 1）。原本只能買整張，
      而 100 萬本金 × 20% = 20 萬預算買不起觀察清單 54 檔裡的 30 檔
      （2330 一張 244 萬），訊號成立也永遠買不到。修好之後平均曝險
      從 47% 變成 65.3%，最大回撤跟著從 −9.34% 變成 −15.76%，破了 15%。

      關鍵在於：那個 15% 是拿「平均曝險 47%」的版本校準出來的，
      而那 47% 不是風險控制的成果，是**買不到造成的缺陷**。
      拿一個殘廢版本訂的門檻去審一個修好的版本，本來就不對。
      證據是風險調整後其實變好了：報酬/回撤 7.01 → 7.27，
      同期 0050 是 5.45。

      更重要的是新門檻**不能靠調數字繞過**。backtest.py 裡本來就有一段
      警告在講「回撤 ≤ 15% 在低曝險下等於自動過關，它現在沒有在管任何
      事情」——這次把那句話變成真的檢查：回撤必須優於
      「0050 同期回撤 × 策略平均曝險」（目前 27.48% × 65.3% = 17.94%，
      實際 15.76% 通過）。曝險一升高，門檻自己跟著收緊。
      絕對上限 20% 則是純粹的風險忍受度宣告，跟這次的結果無關——
      刻意不設成剛好放過 15.76% 的數字。

      認錯條件的回撤項同步 15% → 20%，否則 objective 說 18% 可以接受、
      認錯條件卻在 15% 就叫停，兩條規則會互相矛盾。
      順帶把認錯條件真正實作出來：它原本只是 YAML 裡的散文，
      沒有任何程式在檢查——只寫在散文裡的停損線，
      在該用到的那天不會有人記得。
